<html lang="es">
<head>

  <!-- FUENTE INTER -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0d0e12;
      --bg-surface: #16181f;
      --bg-surface-hover: #1f222c;
      --primary: #e50914;
      --primary-hover: #b80710;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header-sticky {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 14, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.4rem;
    }

    .badge-18 {
      background: rgba(229, 9, 20, 0.15);
      color: var(--primary);
      border: 1px solid rgba(229, 9, 20, 0.3);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .btn-volver:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* CONTENEDOR LAYOUT DE 2 COLUMNAS */
    .layout-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 60px 20px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      width: 100%;
    }

    /* REPRODUCTOR Y MAIN CONTENT */
    .video-main-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* CUADRO PARA SOCIAL BAR / ANUNCIO SUPERIOR */
    .card-ad-top {
      min-height: 90px;
      background: var(--bg-surface);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }

    .box-video-wrapper {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .box-video {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }

    .box-video video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* OVERLAY ANUNCIO REWARDED */
    #overlay-rewarded {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }

    .btn-continue-ad {
      background: linear-gradient(135deg, #e50914 0%, #ff4b55 100%);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    .btn-continue-ad:hover {
      transform: scale(1.04);
    }

    /* ENCABEZADO DEL VIDEO */
    .video-header-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .video-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .views-counter {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn-action:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-like.activo {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* DESCRIPCIÓN */
    .detalles-box {
      background: var(--bg-surface);
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .descripcion-text {
      font-size: 0.92rem;
      color: #d1d5db;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* SECCIÓN DE COMENTARIOS */
    .comments-section {
      background: var(--bg-surface);
      padding: 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .comments-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-input-group {
      display: flex;
      gap: 12px;
    }

    .comment-input-group input {
      width: 50%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .comment-form textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.9rem;
      min-height: 80px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .comment-input-group input:focus, .comment-form textarea:focus {
      border-color: var(--primary);
    }

    .btn-submit-comment {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-submit-comment:hover {
      background: var(--primary-hover);
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .comment-card {
      display: flex;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar-user {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e50914, #7c0d13);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .comment-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-author {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .comment-text {
      font-size: 0.88rem;
      color: #d1d5db;
      line-height: 1.4;
    }

    /* COLUMNA DERECHA: RECOMENDADOS */
    .recommended-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .recommended-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .recommended-card {
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      background: var(--bg-surface);
      padding: 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .recommended-card:hover {
      background: var(--bg-surface-hover);
      transform: translateX(4px);
    }

    .rec-img-wrapper {
      width: 120px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }

    .rec-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rec-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .rec-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-views {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* TOAST NOTIFICACIÓN */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }

    /* RESPONSIVE MÓVIL */
    @media (max-width: 960px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
      .comment-input-group input {
        width: 100%;
      }
    }
  </style>
</head>
