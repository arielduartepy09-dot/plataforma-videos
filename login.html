<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador</title>
  <style>
    body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #1f1f1f; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; font-size: 22px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
    input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #f40612; }
    .error { color: #e50914; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Panel Admin</h2>
    <form id="form-login">
      <div class="input-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="Ingresa tu clave">
      </div>
      <button type="submit">Ingresar</button>
      <div id="mensaje-error" class="error"></div>
    </form>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      const passwordIngresada = document.getElementById('password').value;
      const mensajeError = document.getElementById('mensaje-error');

      try {
        // Petición al servidor Node.js que valida con MongoDB
        const respuesta = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordIngresada })
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
          sessionStorage.setItem('adminAutenticado', 'true');
          window.location.href = 'admin.html';
        } else {
          mensajeError.style.display = 'block';
          mensajeError.textContent = resultado.mensaje;
        }
      } catch (error) {
        mensajeError.style.display = 'block';
        mensajeError.textContent = 'No se pudo conectar con el servidor backend.';
      }
    });
  </script>

</body>
</html>
