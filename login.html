<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador | HOTMEN</title>
  
  <!-- FUENTE INTER -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0d0e12;
      --bg-surface: #16181f;
      --primary: #e50914;
      --primary-hover: #b80710;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .brand-logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert-msg {
      margin-top: 18px;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .alert-msg.error {
      display: block;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #ff4b55;
    }

    .alert-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
    }

    .btn-back-home {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-back-home:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-logo">HOTMEN</div>
    <p class="login-subtitle">Acceso restringido al Panel de Control</p>

    <form id="form-login">
      <div class="input-group">
        <label for="password">Contraseña de Administrador</label>
        <input type="password" id="password" required placeholder="••••••••" autofocus>
      </div>

      <button type="submit" id="btn-ingresar" class="btn-submit">Ingresar</button>
      <div id="mensaje-alerta" class="alert-msg"></div>
    </form>

    <a href="index.html" class="btn-back-home">← Volver al catálogo público</a>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();

      const inputPassword = document.getElementById('password');
      const mensajeAlerta = document.getElementById('mensaje-alerta');
      const btnIngresar = document.getElementById('btn-ingresar');

      const passwordIngresada = inputPassword.value;

      // Reiniciar estados visuales
      mensajeAlerta.className = 'alert-msg';
      mensajeAlerta.style.display = 'none';
      btnIngresar.disabled = true;
      btnIngresar.textContent = 'Verificando...';

      try {
        // Petición con ruta relativa /api/login para local y producción (Render)
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordIngresada })
        });

        const resultado = await respuesta.json();

        if (respuesta.ok && resultado.exito) {
          mensajeAlerta.textContent = '¡Acceso concedido! Redirigiendo...';
          mensajeAlerta.className = 'alert-msg success';

          // Guardar estado de autenticación en sesión
          sessionStorage.setItem('adminAutenticado', 'true');

          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 800);
        } else {
          mensajeAlerta.textContent = resultado.mensaje || 'Contraseña incorrecta.';
          mensajeAlerta.className = 'alert-msg error';
          btnIngresar.disabled = false;
          btnIngresar.textContent = 'Ingresar';
        }
      } catch (error) {
        mensajeAlerta.textContent = 'Error al conectar con el servidor backend.';
        mensajeAlerta.className = 'alert-msg error';
        btnIngresar.disabled = false;
        btnIngresar.textContent = 'Ingresar';
      }
    });
  </script>

</body>
</html>
