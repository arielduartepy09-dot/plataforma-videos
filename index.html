  <style>
    :root {
      --bg-primary: #0d0e12;
      --bg-surface: #16181f;
      --bg-surface-hover: #1f222c;
      --primary: #e50914;
      --primary-hover: #b80710;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER & NAVEGACIÓN */
    .header-sticky {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 14, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
    }

    .logo span {
      background: linear-gradient(135deg, #e50914 0%, #ff4b55 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-18 {
      background: rgba(229, 9, 20, 0.15);
      color: var(--primary);
      border: 1px solid rgba(229, 9, 20, 0.3);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* MENÚ PRINCIPAL DE NAVEGACIÓN */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      transition: var(--transition);
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.active {
      background: var(--primary);
      color: #ffffff;
    }

    /* BÚSQUEDA Y CONTROLES */
    .search-bar {
      flex: 1;
      max-width: 380px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 10px 16px 10px 40px;
      border-radius: 20px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
      background: #1c1f28;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* CONTENEDOR PRINCIPAL */
    .main-container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px 20px;
      flex: 1;
    }

    /* GRILLA ADSTERRA: FORZADA ESTRICTAMENTE A 2 COLUMNAS EN TODO DISPOSITIVO */
    .adsterra-grid-container {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
    }

    .adsterra-native-box {
      width: 100%;
      min-height: 100px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
    }

    /* FILTROS Y CATEGORÍAS */
    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .chip-filter {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .chip-filter:hover, .chip-filter.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* GRID RESTRUCTURADO (2 COLUMNAS MÓVIL, 3 TABLET, 5 ORDENADOR) */
    .grid-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid-content {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .grid-content {
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
    }

    /* TARJETA DE VIDEO / FOTO */
    .tarjeta-item {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      position: relative;
    }

    .tarjeta-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--bg-surface-hover);
    }

    .wrapper-img {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Relación 16:9 */
      background: #000;
      overflow: hidden;
    }

    .wrapper-img img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .tarjeta-item:hover .wrapper-img img {
      transform: scale(1.05);
    }

    .badge-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(229, 9, 20, 0.9);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    .info-item {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .titulo-item {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #ffffff;
    }

    .metricas {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 8px;
      margin-top: auto;
    }

    .metrica-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ESTADO VACÍO / ERRORES */
    .status-container {
      text-align: center;
      grid-column: 1 / -1;
      padding: 80px 20px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .status-container h3 {
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .status-container p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* SKELETON LOADING */
    .skeleton {
      background: linear-gradient(90deg, #16181f 25%, #222530 50%, #16181f 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: var(--radius-md);
      height: 200px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
      padding: 24px 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* ADAPTABILIDAD MÓVIL */
    @media (max-width: 768px) {
      .header-container {
        flex-wrap: wrap;
        padding: 12px 16px;
      }
      .nav-menu {
        order: 2;
      }
      .search-bar {
        order: 3;
        width: 100%;
        max-width: 100%;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER NAVEGACIÓN -->
  <header class="header-sticky">
    <div class="header-container">
      <a href="index.html" class="logo">
        <span>daddyHOT.site</span>
        <span class="badge-18">+18</span>
      </a>

      <!-- MENÚ PRINCIPAL -->
      <nav class="nav-menu">
        <a id="btn-nav-inicio" class="nav-link active" onclick="cambiarVista('videos')">INICIO</a>
        <a id="btn-nav-fotos" class="nav-link" onclick="cambiarVista('fotos')">FOTOS</a>
        <a href="#categorias" class="nav-link" onclick="enfocarCategorias()">CATEGORÍAS</a>
      </nav>

      <!-- BARRA DE BÚSQUEDA -->
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="input-buscar" placeholder="Buscar por título o categoría..." oninput="filtrarContenido()">
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-container">
    
    <!-- SLOT PUBLICIDAD HEADER GENERAL -->

    <!-- SECCIÓN ANUNCIOS NATIVE BANNERS DE ADSTERRA EN 2 COLUMNAS FORZADAS -->
    <div class="adsterra-grid-container">
      <!-- Cuadro 1 de Adsterra -->
      <div class="adsterra-native-box">
        <script async="async" data-cfasync="false" src="https://biomanos.org/21/301e35981b719360f0a86a0a15801a5a"></script>
        <div id="container-301e35981b719360f0a86a0a15801a5a"></div>
      </div>
      <!-- Cuadro 2 de Adsterra (Duplicado para la 2da columna) -->
      <div class="adsterra-native-box">
        <script async="async" data-cfasync="false" src="https://biomanos.org/21/301e35981b719360f0a86a0a15801a5a"></script>
        <div id="container-301e35981b719360f0a86a0a15801a5a-2"></div>
      </div>
    </div>

    <!-- FILTROS Y BARRA DE CATEGORÍAS DINÁMICAS -->
    <div class="categories-bar" id="barra-categorias">
      <button class="chip-filter active" onclick="filtrarCategoria('todos', this)">🔥 Todos</button>
      <button class="chip-filter" onclick="filtrarCategoria('tendencias', this)">⚡ Tendencias</button>
      <button class="chip-filter" onclick="filtrarCategoria('recientes', this)">🆕 Recientes</button>
      <button class="chip-filter" onclick="filtrarCategoria('destacados', this)">⭐ Destacados</button>
    </div>

    <!-- GRID DE VIDEOS / FOTOS -->
    <main class="grid-content" id="contenedor-grid">
      <!-- Skeletons durante carga -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 daddyHOT.site Todos los derechos reservados. Contenido exclusivo para adultos (+18).</p>
  </footer>

  <script>
    let todosLosVideos = [];
    let todasLasFotos = [];
    let vistaActual = 'videos';

    // --- CAMBIAR ENTRE VISTA DE VIDEOS Y FOTOS (GLOBAL) ---
    window.cambiarVista = function(vista) {
      vistaActual = vista;
      document.getElementById('btn-nav-inicio').classList.toggle('active', vista === 'videos');
      document.getElementById('btn-nav-fotos').classList.toggle('active', vista === 'fotos');
      
      if (vista === 'videos') {
        renderizarGrid(todosLosVideos);
      } else {
        renderizarGridFotos(todasLasFotos);
      }
    };

    // --- CARGAR CATEGORÍAS REGISTRADAS DESDE EL ADMIN ---
    async function cargarCategoriasAdmin() {
      const barraCategorias = document.getElementById('barra-categorias');
      try {
        const res = await fetch('/api/categorias');
        if (res.ok) {
          const categorias = await res.json();
          categorias.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'chip-filter';
            btn.textContent = `📁 ${cat.nombre}`;
            btn.onclick = () => window.filtrarPorCategoriaEspecifica(cat.nombre, btn);
            barraCategorias.appendChild(btn);
          });
        }
      } catch (e) {
        console.log('Categorías base cargadas.');
      }
    }

    // --- CARGAR VIDEOS DESDE LA API ---
    async function cargarVideos() {
      const grid = document.getElementById('contenedor-grid');
      try {
        const response = await fetch('/api/videos');
        if (!response.ok) throw new Error('Error en el servidor');
        todosLosVideos = await response.json();

        if (vistaActual === 'videos') {
          if (!todosLosVideos || todosLosVideos.length === 0) {
            grid.innerHTML = `
              <div class="status-container">
                <h3>No hay videos publicados todavía</h3>
                <p>El contenido se actualizará muy pronto. ¡Vuelve a visitarnos!</p>
              </div>`;
            return;
          }
          renderizarGrid(todosLosVideos);
        }
      } catch (error) {
        console.error('Error al obtener los videos:', error);
        if (vistaActual === 'videos') {
          grid.innerHTML = `
            <div class="status-container">
              <h3>Error de conexión con el servidor</h3>
              <p>No pudimos obtener la lista de videos. Intenta recargar la página.</p>
            </div>`;
        }
      }
    }

    // --- CARGAR FOTOS DESDE LA API ---
    async function cargarFotos() {
      try {
        const response = await fetch('/api/fotos');
        if (response.ok) {
          todasLasFotos = await response.json();
          if (vistaActual === 'fotos') renderizarGridFotos(todasLasFotos);
        }
      } catch (error) {
        console.error('Error al obtener las fotos:', error);
      }
    }

    // --- RENDERIZAR GRID DE VIDEOS ---
    function renderizarGrid(listaVideos) {
      const grid = document.getElementById('contenedor-grid');
      grid.innerHTML = '';

      if (listaVideos.length === 0) {
        grid.innerHTML = `
          <div class="status-container">
            <h3>No se encontraron resultados</h3>
            <p>Intenta con otros términos de búsqueda o selecciona otra categoría.</p>
          </div>`;
        return;
      }

      listaVideos.forEach((vid) => {
        const tarjeta = document.createElement('a');
        tarjeta.className = 'tarjeta-item';
        tarjeta.href = `video.html?id=${vid._id}`;
        
        const esPopular = (vid.vistas || 0) > 10;

        tarjeta.innerHTML = `
          <div class="wrapper-img">
            ${esPopular ? '<span class="badge-tag">🔥 Popular</span>' : ''}
            <img src="${vid.urlPortada || 'https://via.placeholder.com/640x360/16181f/9ca3af?text=daddyhot.site'}" alt="${vid.titulo}" loading="lazy">
          </div>
          <div class="info-item">
            <h2 class="titulo-item">${vid.titulo}</h2>
            <div class="metricas">
              <span class="metrica-item">👁️ ${vid.vistas || 0}</span>
              <span class="metrica-item">👍 ${vid.likes || 0}</span>
            </div>
          </div>
        `;
        grid.appendChild(tarjeta);
      });
    }

    // --- RENDERIZAR GRID DE FOTOS ---
    function renderizarGridFotos(listaFotos) {
      const grid = document.getElementById('contenedor-grid');
      grid.innerHTML = '';

      if (listaFotos.length === 0) {
        grid.innerHTML = `
          <div class="status-container">
            <h3>No hay fotos disponibles</h3>
            <p>Se subirán nuevos álbumes y galerías muy pronto.</p>
          </div>`;
        return;
      }

      listaFotos.forEach((foto) => {
        const tarjeta = document.createElement('a');
        tarjeta.className = 'tarjeta-item';
        tarjeta.href = `foto.html?id=${foto._id}`;

        tarjeta.innerHTML = `
          <div class="wrapper-img">
            <span class="badge-tag" style="background: rgba(0, 150, 255, 0.9);">📷 Galería</span>
            <img src="${foto.urlImagen || 'https://via.placeholder.com/640x360/16181f/9ca3af?text=Foto'}" alt="${foto.titulo}" loading="lazy">
          </div>
          <div class="info-item">
            <h2 class="titulo-item">${foto.titulo}</h2>
            <div class="metricas">
              <span class="metrica-item">🖼️ ${foto.cantidadFotos || 1} Fotos</span>
              <span class="metrica-item">❤️ ${foto.likes || 0}</span>
            </div>
          </div>
        `;
        grid.appendChild(tarjeta);
      });
    }

    // --- FILTRADO EN TIEMPO REAL (GLOBAL) ---
    window.filtrarContenido = function() {
      const query = document.getElementById('input-buscar').value.toLowerCase().trim();
      
      if (vistaActual === 'videos') {
        const filtrados = todosLosVideos.filter(vid => 
          vid.titulo.toLowerCase().includes(query) || (vid.categoria && vid.categoria.toLowerCase().includes(query))
        );
        renderizarGrid(filtrados);
      } else {
        const filtrados = todasLasFotos.filter(foto => 
          foto.titulo.toLowerCase().includes(query) || (foto.categoria && foto.categoria.toLowerCase().includes(query))
        );
        renderizarGridFotos(filtrados);
      }
    };

    // --- FILTRADO POR ORDENAMIENTO (GLOBAL) ---
    window.filtrarCategoria = function(categoria, btn) {
      document.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let lista = vistaActual === 'videos' ? [...todosLosVideos] : [...todasLasFotos];

      if (categoria === 'tendencias') {
        lista.sort((a, b) => (b.vistas || b.likes || 0) - (a.vistas || a.likes || 0));
      } else if (categoria === 'recientes') {
        lista.sort((a, b) => new Date(b.fechaCreacion) - new Date(a.fechaCreacion));
      } else if (categoria === 'destacados') {
        lista.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      }

      if (vistaActual === 'videos') renderizarGrid(lista);
      else renderizarGridFotos(lista);
    };

    // --- FILTRADO POR CATEGORÍA ESPECÍFICA (GLOBAL) ---
    window.filtrarPorCategoriaEspecifica = function(nombreCategoria, btn) {
      document.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (vistaActual === 'videos') {
        const filtrados = todosLosVideos.filter(vid => vid.categoria && vid.categoria.toLowerCase() === nombreCategoria.toLowerCase());
        renderizarGrid(filtrados);
      } else {
        const filtrados = todasLasFotos.filter(foto => foto.categoria && foto.categoria.toLowerCase() === nombreCategoria.toLowerCase());
        renderizarGridFotos(filtrados);
      }
    };

    // --- DESPLAZAR A CATEGORÍAS (GLOBAL) ---
    window.enfocarCategorias = function() {
      const barra = document.getElementById('barra-categorias');
      if (barra) barra.scrollIntoView({ behavior: 'smooth' });
    };

    // Inicialización al cargar la página
    cargarCategoriasAdmin();
    cargarVideos();
    cargarFotos();
  </script>

</body>
